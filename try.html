<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburger Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .menu {
            display: none;
            flex-direction: column;
            background-color: #333;
            position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .menu a {
            padding: 15px;
            text-decoration: none;
            color: white;
            text-align: center;
            border-bottom: 1px solid #444;
        }
        .menu a:hover {
            background-color: #555;
        }
        .hamburger {
            display: flex;
            flex-direction: column;
            width: 30px;
            cursor: pointer;
            margin: 10px;
        }
        .bar {
            background-color: black;
            height: 4px;
            margin: 5px 0;
            width: 100%;
        }
        .menu.show {
            display: flex;
            opacity: 1;
        }
        @media (min-width: 600px) {
            .menu {
                display: flex;
                position: static;
                flex-direction: row;
                background: none;
                opacity: 1;
            }
            .menu a {
                color: black;
                border: none;
                padding: 10px 20px;
            }
            .hamburger {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="hamburger" onclick="toggleMenu()">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>
    <nav class="menu" id="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    <script>
        function toggleMenu() {
            var menu = document.getElementById("menu");
            if (menu.classList.contains("show")) {
                menu.style.opacity = "0";
                setTimeout(() => {
                    menu.classList.remove("show");
                }, 300);
            } else {
                menu.classList.add("show");
                setTimeout(() => {
                    menu.style.opacity = "1";
                }, 10);
            }
        }
    </script>
</body>
</html>
